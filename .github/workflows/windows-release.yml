name: Windows x64 release
on:
  workflow_dispatch:
  push:
    tags: ['v*']
jobs:
  build:
    runs-on: windows-2022
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Rust stable
        run: rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy
      - name: Select toolchain
        run: rustup default 1.99.1
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Tests (no physical printing)
        run: cargo test --locked
      - name: Release
        run: cargo build --release --locked
      - name: Dependency notices
        run: |
          cargo install cargo-about --version 0.8.2 --locked
          cargo about generate --locked about.hbs -o THIRD_PARTY_LICENSES.html
      - name: Portable
        shell: pwsh
        run: ./scripts/package.ps1
      - name: Inno Setup
        shell: pwsh
        run: ./scripts/prepare-inno.ps1
      - name: Installer
        shell: pwsh
        run: '& ".\.tools\InnoSetup\ISCC.exe" installer/setup.iss'
      - name: Preset and checksums
        shell: pwsh
        run: |
          Copy-Item presets/label-44x23.json dist/label-44x23.json
          $files = Get-FileHash dist/XprinterQuickPrint_Setup.exe,dist/XprinterQuickPrint_Portable.zip,dist/label-44x23.json -Algorithm SHA256
          $lines = $files | ForEach-Object { "$($_.Hash.ToLowerInvariant())  $(Split-Path $_.Path -Leaf)" }
          [IO.File]::WriteAllLines((Join-Path $PWD 'dist/SHA256SUMS.txt'), $lines, [Text.UTF8Encoding]::new($false))
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: XprinterQuickPrint-Windows-x64-unsigned
          path: |
            dist/XprinterQuickPrint_Setup.exe
            dist/XprinterQuickPrint_Portable.zip
            dist/label-44x23.json
            dist/SHA256SUMS.txt
            Cargo.lock
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Download verified build
        run: gh run download "$GITHUB_RUN_ID" --name XprinterQuickPrint-Windows-x64-unsigned --dir .
      - name: Publish release if absent
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release already exists; preserving its published binaries."
          else
            gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --title "Xprinter Quick Print $GITHUB_REF_NAME" --generate-notes
          fi



