[package]
name = "xprinter-quick-print"
version = "0.4.2"
edition = "2021"
license = "MIT"
build = "build.rs"

[dependencies]
# pdfium-render 0.8.35 accepts libloading="0" but its error match requires 0.8 API.
libloading = "=0.8.9"
anyhow = "1.0"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
slint = { version = "=1.14.1", default-features = false, features = ["std", "backend-winit", "renderer-software", "compat-1-2", "unstable-winit-030"] }
pdfium-render = "=0.8.35"
image = { version = "0.25", default-features = false, features = ["png"] }
rfd = "0.15"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
windows = { version = "=0.58.0", features = ["Win32_Foundation", "Win32_Security", "Win32_Graphics_Gdi", "Win32_Graphics_Printing", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_System_Com", "Win32_Storage_FileSystem", "Win32_Devices_DeviceAndDriverInstallation"] }

[build-dependencies]
resvg = "=0.45.1"
winresource = "=0.1.34"
slint-build = "=1.14.1"

[profile.release]
lto = false
strip = true








[profile.dev]
debug = 0
incremental = false

[profile.test]
debug = 0
incremental = false
